---
layout: default
---
<article class="post">

{% if page.hero %}
  <figure class="hero">
    <img src="{{ page.hero }}" alt="{{ page.hero_alt | default: page.title }}">
  </figure>
{% endif %}

  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      {{ page.date | date: '%B %e, %Y' }}
      &middot; {{ page.author | default: site.author }}
    </p>
  </header>

  {{ content }}

</article>
